<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SmartRent | Đăng bài</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>

  <!-- FontAwesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <style>
    body {
      background: #f8fafc;
      font-family: Inter, system-ui, sans-serif;
    }

    .wrapper {
      margin-top: 110px;
    }

    .card-box {
      background: #fff;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,.08);
    }

    .map-box {
      background: #4f69ac;
      color: #fff;
      border-radius: 18px;
      padding: 18px;
      height: 100%;
    }

    .map-box h6 {
      font-weight: 700;
    }

    #map {
      height: 360px;
      border-radius: 14px;
    }

    label {
      font-size: .85rem;
      font-weight: 600;
      color: #374151;
    }

    .btn-primary {
      background: #1f2937;
      border: none;
      border-radius: 10px;
      padding: 10px;
      font-weight: 600;
    }

    .btn-primary:hover {
      background: #1d4ed8;
    }
  </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg fixed-top bg-white border-bottom">
  <div class="container">
    <a class="navbar-brand fw-bold" href="/">
      Đăng bài cho thuê</span>
    </a>
  </div>
</nav>

<div class="container wrapper">
  <div class="row g-4">

    <!-- FORM -->
    <div class="col-lg-7">
      <form id="postForm" class="card-box">
        <label>Địa chỉ chi tiết</label>
        <input id="address" class="form-control mb-3" placeholder="Số nhà, tên đường">

        <div class="row">
          <div class="col">
            <label>Thành phố</label>
            <input id="city" class="form-control mb-3" value="Hà Nội">
          </div>
          <div class="col">
            <label>Quận</label>
            <input id="district" class="form-control mb-3">
          </div>
          <div class="col">
            <label>Phường</label>
            <input id="ward" class="form-control mb-3">
          </div>
        </div>

        <div class="row">
          <div class="col">
            <label>Diện tích (m²)</label>
            <input id="area" type="number" class="form-control mb-3">
          </div>
          <div class="col">
            <label>Loại hình</label>
            <select id="businessType" class="form-select mb-3">
              <option>Cafe</option>
              <option>Cửa hàng</option>
              <option>Nhà hàng</option>
              <option>Văn phòng</option>
              <option>Khác</option>
            </select>
          </div>
        </div>
        <div class="row">
        <div class="col">
        <label>Giá thuê (VNĐ)</label>
         <input id="price" type="number" class="form-control mb-3"
             placeholder="VD: 12000000">
          </div>
        </div>

        <label>Ảnh đại diện (URL)</label>
<input id="imageUrl" class="form-control mb-3"
       placeholder="https://...">

       <h6 class="fw-bold mt-3">⚙️ Tiện ích</h6>

      <div class="row mb-3">
  <div class="col-6 form-check">
    <input id="wifi" class="form-check-input" type="checkbox">
    <label class="form-check-label">Wifi</label>
  </div>

  <div class="col-6 form-check">
    <input id="parking" class="form-check-input" type="checkbox">
    <label class="form-check-label">Bãi xe</label>
  </div>

  <div class="col-6 form-check">
    <input id="airConditioner" class="form-check-input" type="checkbox">
    <label class="form-check-label">Điều hoà</label>
  </div>

  <div class="col-6 form-check">
    <input id="toilet" class="form-check-input" type="checkbox">
    <label class="form-check-label">WC riêng</label>
  </div>
      </div>


        <label>Mô tả</label>
        <textarea id="description" rows="4" class="form-control mb-3"></textarea>

        <hr>

        <h6 class="fw-bold">📞 Liên hệ</h6>
        <div class="row">
          <div class="col">
            <input id="owner" class="form-control mb-3" placeholder="Tên chủ">
          </div>
          <div class="col">
            <input id="phone" class="form-control mb-3" placeholder="Số điện thoại">
          </div>
        </div>

        <button class="btn btn-primary w-100">
          Đăng bài
        </button>
      </form>
    </div>

    <!-- MAP -->
    <div class="col-lg-5">
      <div class="map-box">
        <h6 class="mb-2">📍 Vị trí trên bản đồ</h6>
        <div id="map"></div>
        <div class="text-secondary mt-2" id="mapText">
          Nhập địa chỉ để hiển thị bản đồ
        </div>
      </div>
    </div>

  </div>
</div>

<script type="module" src="post.js"></script>
</body>
</html>
